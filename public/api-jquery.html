<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery API Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: #172a45;
            --text-primary: #e2e8f0;
            --text-muted: #8892b0;
            --accent-color: #f5a623;
            --accent-hover: #d97706;
            --input-bg: #1f3554;
            --border-color: #233554;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        .navbar { 
            background: rgba(15, 32, 56, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3); 
        }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; color: #fff !important; }
        .navbar-brand i { color: var(--accent-color); }
        .nav-link { color: rgba(255,255,255,.85) !important; font-weight: 500; border-radius: 7px; transition: all .2s; }
        .nav-link:hover { color: #fff !important; background: rgba(255,255,255,.1); }

        .card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); 
            color: var(--text-primary);
        }

        .btn { border-radius: 8px; font-weight: 600; padding: .55rem 1.2rem; transition: all .2s; }
        .btn-primary { 
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); 
            border: none; 
            color: #0a192f !important;
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, var(--accent-hover), var(--accent-color)); 
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #233554;
            border: 1px solid #30476e;
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background-color: #30476e;
            color: #fff;
        }
        .btn-outline-primary {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .btn-outline-primary:hover {
            background-color: var(--accent-color);
            color: #0a192f !important;
        }

        .form-control, .form-select { 
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color); 
            color: var(--text-primary);
            border-radius: 8px; 
            padding: .55rem .9rem; 
        }
        .form-control:focus, .form-select:focus { 
            background-color: #243b59;
            color: #fff;
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2); 
        }
        .form-label { font-weight: 600; color: #a8b2d1; font-size: .9rem; }

        .table-wrapper { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); 
        }
        .table { margin: 0; color: var(--text-primary); }
        .table thead th { background: #1b2f4c; color: #fff; border-bottom: 1px solid var(--border-color); font-weight: 600; padding: 14px 16px; }
        .table tbody td { padding: 13px 16px; vertical-align: middle; border-color: var(--border-color); }
        .table tbody tr:hover { background: #1e324c; }

        .price-tag { color: var(--accent-color); font-weight: 700; }
        .badge-cat { background: rgba(245, 166, 35, 0.15); color: var(--accent-color); font-weight: 600; border-radius: 20px; padding: 4px 12px; font-size: .78rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .page-title i { background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: #0a192f; padding: 8px 10px; border-radius: 10px; font-size: 1rem; }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
        }
        .modal-header {
            border-bottom: 1px solid var(--border-color);
        }
        .modal-footer {
            border-top: 1px solid var(--border-color);
        }

        .alert-danger { background-color: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; color: #ea868f; }
        .alert-success { background-color: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; color: #75b798; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="/webbanhang/Product">
                <i class="bi bi-code-slash"></i> jQuery API Client
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/webbanhang/Product"><i class="bi bi-grid-3x3-gap"></i> Giao diện MVC</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-2">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="page-title mb-0">
                <i class="bi bi-braces"></i> Quản lý sản phẩm bằng jQuery
            </div>
            <button class="btn btn-primary" id="btn-add-product">
                <i class="bi bi-plus-lg me-1"></i> Thêm sản phẩm (jQuery)
            </button>
        </div>

        <!-- Alert phản hồi -->
        <div class="alert alert-dismissible fade show mb-4" id="alert-message" style="display: none;" role="alert">
            <span id="alert-text"></span>
            <button type="button" class="btn-close btn-close-white" onclick="$(this).parent().fadeOut()"></button>
        </div>

        <div class="table-wrapper">
            <table class="table" id="product-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Mã</th>
                        <th>Tên sản phẩm</th>
                        <th>Mô tả</th>
                        <th>Danh mục</th>
                        <th>Giá sản phẩm</th>
                        <th style="width: 180px;" class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="text-center py-5" id="table-loading">
                            <div class="spinner-border text-warning" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="text-muted mt-2 mb-0">Đang nạp dữ liệu bằng AJAX...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm sản phẩm</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="productForm">
                    <input type="hidden" id="productId" name="id">
                    <div class="modal-body">
                        <!-- Alert Lỗi Validation -->
                        <div class="alert alert-danger mb-3" id="form-error" style="display: none;">
                            <ul class="mb-0 ps-3" id="form-error-list"></ul>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label" for="name">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Nhập tên sản phẩm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="price">Giá sản phẩm <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" id="price" name="price" class="form-control" placeholder="0" min="0" required>
                                    <span class="input-group-text">đ</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="category_id">Danh mục <span class="text-danger">*</span></label>
                                <select id="category_id" name="category_id" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="description">Mô tả sản phẩm <span class="text-danger">*</span></label>
                                <textarea id="description" name="description" class="form-control" rows="4" placeholder="Mô tả sản phẩm" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary" id="btn-save">Lưu lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            const apiBaseUrl = '/webbanhang/api';
            const modal = new bootstrap.Modal(document.getElementById('productModal'));
            
            // Tải danh mục vào form select
            function loadCategories() {
                $.getJSON(`${apiBaseUrl}/category`, function(categories) {
                    const $select = $('#category_id');
                    $select.find('option:not(:first)').remove(); // Xóa các option cũ trừ option mặc định
                    categories.forEach(function(category) {
                        $select.append($('<option>', {
                            value: category.id,
                            text: category.name
                        }));
                    });
                }).fail(function() {
                    console.error('Lỗi khi tải danh mục');
                });
            }

            // Tải danh sách sản phẩm bằng AJAX
            function loadProducts() {
                $.getJSON(`${apiBaseUrl}/product`, function(products) {
                    const $tbody = $('#product-table tbody');
                    $tbody.empty();
                    
                    if (products.length === 0) {
                        $tbody.append('<tr><td colspan="6" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Chưa có sản phẩm nào.</td></tr>');
                        return;
                    }
                    
                    products.forEach(function(product) {
                        const formattedPrice = new Intl.NumberFormat('vi-VN').format(product.price) + 'đ';
                        const catBadge = product.category_name ? `<span class="badge-cat">${product.category_name}</span>` : '<span class="text-muted">—</span>';
                        
                        const row = `
                            <tr>
                                <td class="fw-bold">#${product.id}</td>
                                <td class="fw-semibold text-white">${escapeHtml(product.name)}</td>
                                <td class="text-muted small">${escapeHtml(product.description || '')}</td>
                                <td>${catBadge}</td>
                                <td class="price-tag">${formattedPrice}</td>
                                <td class="text-center">
                                    <button class="btn btn-outline-primary btn-sm btn-edit me-1" data-id="${product.id}"><i class="bi bi-pencil-square"></i> Sửa</button>
                                    <button class="btn btn-danger btn-sm btn-delete" data-id="${product.id}"><i class="bi bi-trash"></i> Xóa</button>
                                </td>
                            </tr>
                        `;
                        $tbody.append(row);
                    });
                }).fail(function() {
                    $('#product-table tbody').html('<tr><td colspan="6" class="text-center text-danger py-5"><i class="bi bi-exclamation-triangle fs-3 d-block mb-2"></i>Lỗi kết nối API lấy danh sách sản phẩm.</td></tr>');
                });
            }

            // Khởi động nạp danh mục và danh sách
            loadCategories();
            loadProducts();

            // Hiển thị alert phản hồi
            function showAlert(type, message) {
                const $alert = $('#alert-message');
                $alert.removeClass('alert-success alert-danger')
                      .addClass('alert-' + type);
                $('#alert-text').html(message);
                $alert.fadeIn();
                setTimeout(function() {
                    $alert.fadeOut();
                }, 5000);
            }

            // Click nút Thêm sản phẩm
            $('#btn-add-product').click(function() {
                $('#modalTitle').text('Thêm sản phẩm mới (jQuery)');
                $('#productForm')[0].reset();
                $('#productId').val('');
                $('#form-error').hide();
                modal.show();
            });

            // Submit Form (Add hoặc Edit)
            $('#productForm').submit(function(e) {
                e.preventDefault();
                $('#form-error').hide();
                $('#form-error-list').empty();
                
                const id = $('#productId').val();
                const productData = {
                    name: $('#name').val(),
                    price: parseFloat($('#price').val()),
                    category_id: parseInt($('#category_id').val()),
                    description: $('#description').val()
                };
                
                const isEdit = id !== '';
                const url = isEdit ? `${apiBaseUrl}/product/${id}` : `${apiBaseUrl}/product`;
                const method = isEdit ? 'PUT' : 'POST';
                
                $.ajax({
                    url: url,
                    type: method,
                    contentType: 'application/json',
                    data: JSON.stringify(productData),
                    success: function(response) {
                        modal.hide();
                        showAlert('success', `<i class="bi bi-check-circle-fill me-1"></i> ${isEdit ? 'Cập nhật' : 'Thêm'} sản phẩm thành công!`);
                        loadProducts();
                    },
                    error: function(xhr) {
                        const response = xhr.responseJSON;
                        $('#form-error').show();
                        if (response && response.errors) {
                            for (const field in response.errors) {
                                $('#form-error-list').append(`<li>${response.errors[field]}</li>`);
                            }
                        } else {
                            $('#form-error-list').append(`<li>${(response && response.message) || 'Có lỗi xảy ra khi lưu sản phẩm.'}</li>`);
                        }
                    }
                });
            });

            // Click sửa sản phẩm
            $(document).on('click', '.btn-edit', function() {
                const id = $(this).data('id');
                $('#modalTitle').text('Chỉnh sửa sản phẩm #' + id);
                $('#form-error').hide();
                
                $.getJSON(`${apiBaseUrl}/product/${id}`, function(product) {
                    $('#productId').val(product.id);
                    $('#name').val(product.name);
                    $('#price').val(product.price);
                    $('#category_id').val(product.category_id);
                    $('#description').val(product.description || '');
                    modal.show();
                }).fail(function() {
                    showAlert('danger', '<i class="bi bi-x-circle-fill me-1"></i> Không thể nạp thông tin sản phẩm.');
                });
            });

            // Click xóa sản phẩm
            $(document).on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (confirm('Bạn có thực sự muốn xóa sản phẩm #' + id + ' không?')) {
                    $.ajax({
                        url: `${apiBaseUrl}/product/${id}`,
                        type: 'DELETE',
                        success: function(response) {
                            showAlert('success', '<i class="bi bi-check-circle-fill me-1"></i> Xóa sản phẩm thành công!');
                            loadProducts();
                        },
                        error: function() {
                            showAlert('danger', '<i class="bi bi-x-circle-fill me-1"></i> Xóa sản phẩm thất bại.');
                        }
                    });
                }
            });

            // Hàm Escape HTML tránh tấn công XSS trên Client Side
            function escapeHtml(text) {
                if (!text) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
            }
        });
    </script>
</body>
</html>
